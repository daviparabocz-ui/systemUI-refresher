name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Extrair o projeto do zip
        run: unzip -o SystemUIRefresh.zip -d .

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # O projeto não vem com o gradlew (wrapper), então instalamos o Gradle diretamente
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: SystemUIRefresh
        run: gradle assembleDebug

      # Descomente para gerar também o Release (precisa de keystore configurado)
      # - name: Build Release APK
      #   working-directory: SystemUIRefresh
      #   run: gradle assembleRelease

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SystemUIRefresh/app/build/outputs/apk/debug/*.apk
          
